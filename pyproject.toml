[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatJiXia"
dynamic = ["version"]
description = "ChatJiXia: ChatArch package for JiXia Lean analysis integration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0", "chatstyle>=0.1.0,<0.2.0", "chatenv>=0.2.0,<0.3.0"]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatjixia", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatJiXia"
Repository = "https://github.com/ChatArch/ChatJiXia"

[project.scripts]
chatjixia = "chatjixia.cli:main"

[project.entry-points."chatenv.configs"]
chatjixia = "chatjixia.config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]

[tool.setuptools.dynamic]
version = {attr = "chatjixia.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
